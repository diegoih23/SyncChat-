server:
  port: ${PORT:8085}
spring:
  application:
    name: servicio-tiempo-real
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:syncchat}
    password: ${RABBITMQ_PASSWORD:syncchat}
  listener:
    simple:
      default-requeue-rejected: false
syncchat:
  jwt:
    secret: ${JWT_SECRET:syncchat-development-secret-key-change-in-production-32}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:13000,http://localhost:5173}
  conversaciones:
    participantes-url: ${CONVERSATIONS_AUTH_URL:http://localhost:8082/api/conversaciones}
    service-token: ${AUTH_DIRECTORY_TOKEN:syncchat-directory-development-token}
