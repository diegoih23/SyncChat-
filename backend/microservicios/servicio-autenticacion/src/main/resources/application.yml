server:
  port: ${PORT:8081}
spring:
  application:
    name: servicio-autenticacion
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:usuarios}
    username: ${DB_USER:syncchat}
    password: ${DB_PASSWORD:syncchat}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never

syncchat:
  jwt:
    secret: ${JWT_SECRET:syncchat-development-secret-key-change-in-production-32}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  recovery:
    expiration-ms: ${RECOVERY_EXPIRATION_MS:900000}
  internal:
    service-token: ${AUTH_DIRECTORY_TOKEN:syncchat-directory-development-token}
management:
  endpoints:
    web:
      exposure:
        include: health,info
