services:
  postgres:
    image: postgres:16-alpine
    container_name: syncchat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncchat}
      POSTGRES_DB: ${POSTGRES_DB:-syncchat}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../base-datos/inicializacion:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncchat -d syncchat"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: syncchat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-syncchat}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-syncchat}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  rabbitmq-data:
