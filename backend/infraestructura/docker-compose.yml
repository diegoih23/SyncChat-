services:
  gateway:
    build: ../gateway
    container_name: syncchat-gateway
    ports:
      - "${GATEWAY_PORT_HOST:-8080}:8080"
    environment:
      AUTH_SERVICE_URL: http://servicio-autenticacion:8081
      CONVERSATIONS_SERVICE_URL: http://servicio-conversaciones:8082
      MESSAGES_SERVICE_URL: http://servicio-mensajes:8084
      REALTIME_WS_URL: ws://servicio-tiempo-real:8085
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe configurarse en el archivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:13000,http://localhost:5173,http://192.168.1.82:13000,http://10.20.138.26:13000}
    depends_on:
      servicio-autenticacion:
        condition: service_healthy
      servicio-conversaciones:
        condition: service_healthy
      servicio-mensajes:
        condition: service_healthy
      servicio-tiempo-real:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  servicio-autenticacion:
    build: ../microservicios/servicio-autenticacion
    container_name: syncchat-autenticacion
    environment:
      PORT: 8081
      DB_HOST: postgres-usuarios
      DB_PORT: 5432
      DB_NAME: usuarios
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER debe configurarse en el archivo .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe configurarse en el archivo .env}
      AUTH_DIRECTORY_TOKEN: ${AUTH_DIRECTORY_TOKEN:?AUTH_DIRECTORY_TOKEN debe configurarse en el archivo .env}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres-usuarios:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  servicio-conversaciones:
    build: ../microservicios/servicio-conversaciones
    container_name: syncchat-conversaciones
    environment:
      PORT: 8082
      DB_HOST: postgres-conversaciones
      DB_PORT: 5432
      DB_NAME: conversaciones
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER debe configurarse en el archivo .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en el archivo .env}
      AUTH_LOOKUP_URL: http://gateway:8080/api/auth/usuarios/buscar
      AUTH_USER_URL: http://gateway:8080/api/auth/usuarios
      AUTH_DIRECTORY_TOKEN: ${AUTH_DIRECTORY_TOKEN:?AUTH_DIRECTORY_TOKEN debe configurarse en el archivo .env}
    ports:
      - "${CONVERSACIONES_PORT_HOST:-8082}:8082"
    depends_on:
      postgres-conversaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  servicio-mensajes:
    build: ../microservicios/servicio-mensajes
    container_name: syncchat-mensajes
    environment:
      PORT: 8084
      DB_HOST: postgres-mensajes
      DB_PORT: 5432
      DB_NAME: mensajes
      DB_USER: ${POSTGRES_USER:?POSTGRES_USER debe configurarse en el archivo .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en el archivo .env}
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe configurarse en el archivo .env}
      AUTH_DIRECTORY_TOKEN: ${AUTH_DIRECTORY_TOKEN:?AUTH_DIRECTORY_TOKEN debe configurarse en el archivo .env}
      CONVERSATIONS_AUTH_URL: http://servicio-conversaciones:8082/api/conversaciones
    ports:
      - "${MENSAJES_PORT_HOST:-8084}:8084"
    depends_on:
      postgres-mensajes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      servicio-conversaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  servicio-tiempo-real:
    build: ../microservicios/servicio-tiempo-real
    container_name: syncchat-tiempo-real
    ports:
      - "${REALTIME_PORT_HOST:-8085}:8085"
    environment:
      PORT: 8085
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe configurarse en el archivo .env}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER debe configurarse en el archivo .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD debe configurarse en el archivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:13000,http://localhost:5173,http://192.168.1.82:13000,http://10.20.138.26:13000}
      CONVERSATIONS_AUTH_URL: http://servicio-conversaciones:8082/api/conversaciones
      AUTH_DIRECTORY_TOKEN: ${AUTH_DIRECTORY_TOKEN:?AUTH_DIRECTORY_TOKEN debe configurarse en el archivo .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
      servicio-conversaciones:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  postgres-usuarios:
    image: postgres:16-alpine
    container_name: syncchat-postgres-usuarios
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER debe configurarse en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en el archivo .env}
      POSTGRES_DB: usuarios
    volumes:
      - postgres-usuarios-data:/var/lib/postgresql/data
      - ../base-datos/usuarios:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-syncchat} -d usuarios"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-conversaciones:
    image: postgres:16-alpine
    container_name: syncchat-postgres-conversaciones
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER debe configurarse en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en el archivo .env}
      POSTGRES_DB: conversaciones
    volumes:
      - postgres-conversaciones-data:/var/lib/postgresql/data
      - ../base-datos/conversaciones:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-syncchat} -d conversaciones"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-mensajes:
    image: postgres:16-alpine
    container_name: syncchat-postgres-mensajes
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER debe configurarse en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse en el archivo .env}
      POSTGRES_DB: mensajes
    volumes:
      - postgres-mensajes-data:/var/lib/postgresql/data
      - ../base-datos/mensajes:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-syncchat} -d mensajes"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: syncchat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER debe configurarse en el archivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD debe configurarse en el archivo .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ../../frontend
    container_name: syncchat-frontend
    ports:
      - "${FRONTEND_PORT_HOST:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-usuarios-data:
  postgres-conversaciones-data:
  postgres-mensajes-data:
  rabbitmq-data:
