services:
  postgres-usuarios:
    image: postgres:16-alpine
    container_name: syncchat-postgres-usuarios
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: usuarios
    ports: ["5433:5432"]
    volumes:
      - postgres-usuarios-data:/var/lib/postgresql/data
      - ../../base-datos/usuarios:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d usuarios"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: syncchat-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  servicio-autenticacion:
    build: ../../microservicios/servicio-autenticacion
    container_name: syncchat-autenticacion
    environment:
      PORT: 8081
      DB_HOST: postgres-usuarios
      DB_PORT: 5432
      DB_NAME: usuarios
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8081:8081"]
    depends_on:
      postgres-usuarios:
        condition: service_healthy

  gateway:
    build: ../../gateway
    container_name: syncchat-gateway
    ports: ["8080:8080"]
    environment:
      AUTH_SERVICE_URL: http://servicio-autenticacion:8081
      CONVERSATIONS_SERVICE_URL: http://${JOSIBEL_IP}:8082
      MESSAGES_SERVICE_URL: http://${WAGNER_IP}:8084
      REALTIME_WS_URL: ws://${EMILIO_IP}:8085
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://${JUAN_IP}:3000
    depends_on:
      - servicio-autenticacion

  frontend:
    build:
      context: ../../../frontend
      dockerfile: Dockerfile.distribuido
    container_name: syncchat-frontend
    environment:
      GATEWAY_HOST: ${JUAN_IP}
      GATEWAY_PORT: 8080
    ports: ["3000:80"]
    depends_on: [gateway]

volumes:
  postgres-usuarios-data:
  rabbitmq-data:
