services:
  postgres-usuarios:
    extends:
      file: docker-compose.yml
      service: postgres-usuarios

  rabbitmq:
    extends:
      file: docker-compose.yml
      service: rabbitmq
    ports:
      - "5672:5672"

  servicio-autenticacion:
    extends:
      file: docker-compose.yml
      service: servicio-autenticacion

  servicio-tiempo-real:
    build: ../microservicios/servicio-tiempo-real
    environment:
      PORT: 8085
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER debe configurarse en el archivo .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD debe configurarse en el archivo .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe configurarse en el archivo .env}
      CONVERSATIONS_AUTH_URL: http://${JOSIBEL_IP:-192.168.1.12}:8082/api/conversaciones
      AUTH_DIRECTORY_TOKEN: ${AUTH_DIRECTORY_TOKEN:?AUTH_DIRECTORY_TOKEN debe configurarse en el archivo .env}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  gateway:
    build: ../gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://servicio-autenticacion:8081
      CONVERSATIONS_SERVICE_URL: http://${JOSIBEL_IP:-192.168.1.12}:8082
      MESSAGES_SERVICE_URL: http://${WAGNER_IP:-192.168.1.11}:8084
      REALTIME_WS_URL: ws://servicio-tiempo-real:8085
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET debe configurarse en el archivo .env}
      CORS_ALLOWED_ORIGINS: http://${JUAN_IP:-192.168.1.10}:3000
    depends_on:
      servicio-autenticacion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend

volumes:
  postgres-usuarios-data:
  rabbitmq-data:
