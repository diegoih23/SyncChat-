server:
  port: ${PORT:8080}
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: tiempo-real-websocket
          uri: ${REALTIME_WS_URL:ws://localhost:8085}
          predicates: [Path=/ws/mensajes/**]
        - id: autenticacion
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/auth/**]
          filters: [StripPrefix=2]
        - id: conversaciones
          uri: ${CONVERSATIONS_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/conversaciones/**]
        - id: mensajes
          uri: ${MESSAGES_SERVICE_URL:http://localhost:8084}
          predicates: [Path=/api/mensajes/**]

syncchat:
  jwt:
    secret: ${JWT_SECRET:syncchat-development-secret-key-change-in-production-32}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
