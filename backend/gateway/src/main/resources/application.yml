server:
  port: ${PORT:8080}
spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: autenticacion
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates: [Path=/api/auth/**]
        - id: conversaciones
          uri: ${CONVERSATIONS_SERVICE_URL:http://localhost:8082}
          predicates: [Path=/api/conversaciones/**]
        - id: chat
          uri: ${CHAT_SERVICE_URL:http://localhost:8083}
          predicates: [Path=/api/chat/**]
        - id: mensajes
          uri: ${MESSAGES_SERVICE_URL:http://localhost:8084}
          predicates: [Path=/api/mensajes/**]
